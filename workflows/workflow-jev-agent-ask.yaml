id: 3733fa47-988e-4385-b808-dc4e62f4ae6a
name: "@mgreten/jev-agent-ask"
description: Prepare scoped state, ask Jev once for combined questions or concurrently across files, and return answer-only results.
tags: {}
inputs:
  properties:
    agentModel:
      type: string
      description: Name of the configured @mgreten/jev-agent-tools model instance.
    jevModel:
      type: string
      description: Name of the configured @swamp/typesafe-ai model instance (also set as agentModel's jevModel global argument).
    mode:
      type: string
      enum: [combined, per-file]
    state:
      description: Caller-supplied task or other context; use an empty string when only files matter.
    questions:
      type: object
    paths:
      type: array
      items: { type: string }
      default: []
    globs:
      type: array
      items: { type: string }
      default: []
  required: [agentModel, jevModel, mode, state, questions]
jobs:
  - name: prepare
    steps:
      - name: select
        task:
          type: model_method
          modelIdOrName: ${{ inputs.agentModel }}
          methodName: prepare
          inputs:
            mode: ${{ inputs.mode }}
            state: ${{ inputs.state }}
            questions: ${{ inputs.questions }}
            paths: ${{ inputs.paths }}
            globs: ${{ inputs.globs }}
  - name: evaluate
    dependsOn:
      - job: prepare
        condition: { type: succeeded }
    steps:
      - name: ask-combined
        guard: ${{ inputs.mode != "combined" }}
        task:
          type: model_method
          modelIdOrName: ${{ inputs.jevModel }}
          methodName: ask
          inputs:
            name: ${{ data.query('modelName == "' + inputs.agentModel + '" && specName == "prepared" && workflowRunId == "' + run.id + '"')[0].attributes.requests[0].name }}
            state: ${{ data.query('modelName == "' + inputs.agentModel + '" && specName == "prepared" && workflowRunId == "' + run.id + '"')[0].attributes.requests[0].state }}
            questions: ${{ data.query('modelName == "' + inputs.agentModel + '" && specName == "prepared" && workflowRunId == "' + run.id + '"')[0].attributes.requests[0].questions }}
      - name: ask-files
        guard: ${{ inputs.mode != "per-file" }}
        task:
          type: model_method
          modelIdOrName: ${{ inputs.jevModel }}
          methodName: triage_batch
          inputs:
            name: ${{ data.query('modelName == "' + inputs.agentModel + '" && specName == "prepared" && workflowRunId == "' + run.id + '"')[0].attributes.batchName }}
            items: >-
              ${{ data.query('modelName == "' + inputs.agentModel + '" && specName == "prepared" && workflowRunId == "' + run.id + '"')[0].attributes.requests.map(r, {"id": r.name, "state": r.state}) }}
            questions: ${{ data.query('modelName == "' + inputs.agentModel + '" && specName == "prepared" && workflowRunId == "' + run.id + '"')[0].attributes.requests[0].questions }}
            concurrency: 4
  - name: collect
    dependsOn:
      - job: evaluate
        condition: { type: succeeded }
    steps:
      - name: answers
        task:
          type: model_method
          modelIdOrName: ${{ inputs.agentModel }}
          methodName: collect
          inputs:
            sourceModel: ${{ inputs.agentModel }}
            preparationName: ${{ data.query('modelName == "' + inputs.agentModel + '" && specName == "prepared" && workflowRunId == "' + run.id + '"')[0].name }}
version: 1
